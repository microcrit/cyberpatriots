title: Crit's Unsafe VMWare Spoofing (Linux)
description: Applies settings to make a functional VirtualBox instance appear as VMWare/CCS-compatible. You WILL be disqualified.
tags:
  - hardening
  - unsafe
  - ccs
warning: Warnings.UNSAFE
runs_on:
  - linux

settings:
  - id: spoof_vmware
    title: Spoof VMWare/CCS
    description: Modifies system files to make a VirtualBox instance appear as a VMWare/CCS-compatible virtual machine. This will most likely disqualify you from CCS. Do not use this.
    type: boolean
    default: false
  - id: os
    title: Operating System
    required: linux
    description: The operating system on which to apply the spoofing settings.
    type: os

eval:
  - use: patch
    when: spoof_vmware
    file: /etc/machine-id
    name: Spoof VMWare Machine ID
    requirements:
      - type: file_exists
      - type: sudo
    patch:
      - type: replace
        pattern: '^[0-9a-f]{32}$'
        replacement:
          use: cmd
          command: cat /proc/sys/kernel/random/uuid | tr -d '-' | cut -c1-32
  - use: patch
    when: spoof_vmware
    file: /etc/udev/rules.d/99-vm.rules
    name: Spoof VMWare Udev Rules
    requirements:
      - type: sudo
    patch:
      - type: add_if_missing
        content: |
          SUBSYSTEM=="block", ATTRS{vendor}=="VMware ", ATTRS{model}=="Virtual disk"
          SUBSYSTEM=="net", ATTR{address}=="00:0C:29:*", NAME="eth0"
          SUBSYSTEM=="net", ATTR{address}=="00:50:56:*", NAME="eth0"
          SUBSYSTEM=="net", ATTR{address}=="00:1C:14:*", NAME="eth0"
          SUBSYSTEM=="net", ATTR{address}=="00:05:69:*", NAME="eth0"
          SUBSYSTEM=="net", ATTR{address}=="00:0C:29:*", NAME="eth1"
          SUBSYSTEM=="net", ATTR{address}=="00:50:56:*", NAME="eth1"
          SUBSYSTEM=="net", ATTR{address}=="00:1C:14:*", NAME="eth1"
          SUBSYSTEM=="net", ATTR{address}=="00:05:69:*", NAME="eth1"
  - use: patch
    when: spoof_vmware
    file: /etc/udev/rules.d/99-vm.rules
    name: Spoof VMWare MAC Addresses
    requirements:
      - type: sudo
    patch:
      - type: upsert
        replacement:
          use: cmd
          for:
            range: 16
            cmd:
              - printf 'SUBSYSTEM=="net", ATTR{address}=="00:0C:29:%02X:%02X:%02X", NAME="eth%d"\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $i
              - printf 'SUBSYSTEM=="net", ATTR{address}=="00:1C:14:%02X:%02X:%02X", NAME="eth%d"\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $i
              - printf 'SUBSYSTEM=="net", ATTR{address}=="00:05:69:%02X:%02X:%02X", NAME="eth%d"\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $i
              - printf 'SUBSYSTEM=="net", ATTR{address}=="00:50:56:%02X:%02X:%02X", NAME="eth%d"\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $i
  - use: patch
    when: spoof_vmware
    file: /etc/udev/rules.d/99-vm.rules
    name: Spoof VMWare Disk Identifiers
    requirements:
      - type: sudo
    patch:
      - type: upsert
        replacement:
          use: cmd
          for:
            range: 16
            cmd:
              - printf 'SUBSYSTEM=="block", ATTRS{vendor}=="VMware ", ATTRS{model}=="Virtual disk %d"\n' $i